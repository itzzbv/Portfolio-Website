<header class="header">
  <div class="container">
    <div class="header-content">
      <a routerLink="/" class="logo"></a>

      <button class="menu-toggle" (click)="toggleMenu()" [attr.aria-expanded]="isMenuOpen" aria-label="Toggle Navigation Menu">
        <span class="hamburger"></span>
        <span class="hamburger"></span>
        <span class="hamburger"></span>
      </button>

      <nav class="nav" [class.active]="isMenuOpen">
        <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}" (click)="closeMenu()">Home</a>
        <a routerLink="/projects" routerLinkActive="active" (click)="closeMenu()">Projects</a>
        <a [routerLink]="['/']" fragment="about" (click)="closeMenu()">About</a>
        <a [routerLink]="['/']" fragment="capabilities" (click)="closeMenu()">Capabilities</a>
        <a [routerLink]="['/']" fragment="contact" (click)="closeMenu()">Contact</a>
        <a href="https://github.com/itzzbv" target="_blank" rel="noopener" class="nav-btn" (click)="closeMenu()">
          GitHub
        </a>
      </nav>
    </div>
  </div>
</header>
